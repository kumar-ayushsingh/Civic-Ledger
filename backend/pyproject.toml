[project]
name = "civicledger-backend"
version = "0.1.0"
description = "CivicLedger Backend API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.35",
    "pillow>=10.4.0",
    "imagehash>=4.3.1",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]

